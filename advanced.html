<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>【上級】たすきがけの因数分解</title>
  <style>
    :root{
      --fg:#111; --muted:#6a6a6a; --ok:#147a2e; --bad:#c51f1a;
      --bg:#f6f7fb; --card:#fff; --line:#d9d9d9; --dash:#b7b7b7; --accent:#2b6de8;
    }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans JP", sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .wrap{ max-width:1180px; margin:6px auto; padding:6px; }
    .panel{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:14px;
      padding:8px;
      box-shadow:0 6px 18px rgba(0,0,0,.05);
    }
    .topbar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      margin-bottom:6px;
    }
    h1{ font-size:16px; margin:0; }
    .badge{
      padding:5px 9px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fafafa;
      font-size:12px;
      font-weight:900;
    }

    .boardWrap{
      position:relative;
      border:2px dashed var(--dash);
      border-radius:18px;
      padding:8px;
      background:#fff;
      overflow:hidden;
    }

    /* ★線は背面 */
    .lines{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index:0;
    }
    .lines line{
      stroke:#111;
      stroke-width:2.2;
      opacity:.55;
      stroke-linecap:round;
    }
    .lines path{
      stroke:#111;
      stroke-width:2.2;
      opacity:.55;
      fill:none;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .board{
      position:relative;
      display:grid;
      grid-template-columns: 275px 130px 275px 80px 230px;
      grid-template-rows: 60px 78px 28px 78px 118px;
      gap:10px;
      align-items:center;
      justify-content:center;
      z-index:1;
    }

    .blank{ width:100%; height:100%; background:transparent; border-radius:14px; }

    .termBox{
      border:2px solid #c9d4ff;
      background:#f3f5ff;
      border-radius:14px;
      padding:8px 10px;
      font-weight:1000;
      font-size:17px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      box-sizing:border-box;
    }
    .termMidWrap{ position:relative; width:100%; height:100%; }
    .termMid{
      border:2px solid #ddd;
      background:#fff;
      border-radius:14px;
      padding:8px 10px;
      font-weight:1000;
      font-size:17px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      box-sizing:border-box;
      position:relative;
    }

    .in{
      width:100%;
      padding:14px 10px;
      border:2px solid #888;
      border-radius:14px;
      font-size:17px;
      text-align:center;
      outline:none;
      background:#fff;
      box-sizing:border-box;
    }
    .in:focus{ border-color:var(--accent); }
    .in::placeholder{ color:rgba(0,0,0,.28); font-weight:1000; letter-spacing:.08em; }

    .box{
      border:2px solid #aaa;
      border-radius:14px;
      background:#fafafa;
      padding:10px 10px;
      min-height:44px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:17px;
      font-weight:1000;
      text-align:center;
      box-sizing:border-box;
    }
    .box.muted{ color:var(--muted); font-weight:900; }

    .judgePill{
      padding:7px 10px;
      border-radius:999px;
      border:2px solid #bbb;
      background:#fff;
      font-weight:1000;
      font-size:13px;
      color:var(--muted);
      min-width:140px;
      text-align:center;
      margin:6px auto 0;
      display:block;
      box-sizing:border-box;
    }
    .judgePill.ok{ border-color: rgba(20,122,46,.35); background: rgba(20,122,46,.08); color: var(--ok); }
    .judgePill.bad{ border-color: rgba(197,31,26,.35); background: rgba(197,31,26,.08); color: var(--bad); }

    .plus{
      text-align:center;
      font-size:22px;
      font-weight:1000;
      opacity:.6;
      user-select:none;
      line-height:1;
    }

    .sumCell{ position:relative; }
    .sumJudge{
      margin-top:6px;
      padding:8px 10px;
      border-radius:999px;
      border:2px solid #bbb;
      background:#fff;
      font-weight:1000;
      font-size:13px;
      text-align:center;
      color:var(--muted);
      box-sizing:border-box;
    }
    .sumJudge.ok{ border-color: rgba(20,122,46,.35); background: rgba(20,122,46,.08); color: var(--ok); }
    .sumJudge.bad{ border-color: rgba(197,31,26,.35); background: rgba(197,31,26,.08); color: var(--bad); }

    .ring{
      position:absolute;
      inset:-10px;
      border-radius:999px;
      border:3px solid #bbb;
      pointer-events:none;
      display:none;
      box-sizing:border-box;
    }
    .ring.ok{ border-color: rgba(20,122,46,.75); }
    .ring.bad{ border-color: rgba(197,31,26,.75); }

    .cellWrap{ width:100%; }
    .miniJudge{
      margin-top:6px;
      padding:7px 10px;
      border-radius:999px;
      border:2px solid #bbb;
      background:#fff;
      font-weight:1000;
      font-size:13px;
      text-align:center;
      color:var(--muted);
      box-sizing:border-box;
    }
    .miniJudge.ok{ border-color: rgba(20,122,46,.35); background: rgba(20,122,46,.08); color: var(--ok); }
    .miniJudge.bad{ border-color: rgba(197,31,26,.35); background: rgba(197,31,26,.08); color: var(--bad); }

    .actions{
      margin-top:8px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    button{
      padding:9px 12px;
      border-radius:12px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      font-weight:1000;
      font-size:14px;
    }
    button.primary{ background: var(--accent); color:#fff; border-color: var(--accent); }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    button:active{ transform: translateY(1px); }

    /* === 正解演出（通常） === */
    .winOverlay{
      position:fixed;
      inset:0;
      display:none;
      place-items:center;
      z-index:9999;
      pointer-events:none;
      background:rgba(0,0,0,.18);
      backdrop-filter: blur(2px);
    }
    .winOverlay.show{ display:grid; }
    .winInner{
      position:relative;
      width:min(720px,92vw);
      border-radius:22px;
      padding:26px 22px 18px;
      background:rgba(255,255,255,.92);
      border:2px solid rgba(0,0,0,.15);
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      text-align:center;
      animation: winPop 1100ms ease-out forwards;
      overflow:hidden;
      isolation:isolate;
    }
    .winText{
      position:relative;
      z-index:2;
      font-weight:1000;
      font-size:clamp(34px,6vw,62px);
      letter-spacing:.03em;
      text-shadow:0 2px 0 rgba(0,0,0,.08);
      animation: winGlow 600ms ease-in-out infinite alternate;
    }
    .winSub{
      position:relative;
      z-index:2;
      margin-top:6px;
      font-weight:900;
      color:rgba(0,0,0,.55);
      font-size:14px;
    }
    .winBurst{
      position:absolute;
      inset:-26px;
      border-radius:26px;
      background:
        radial-gradient(circle at 50% 50%, rgba(43,109,232,.28) 0%, rgba(43,109,232,0) 55%),
        conic-gradient(from 0deg,
          rgba(255,255,255,0) 0 10%,
          rgba(43,109,232,.25) 10% 15%,
          rgba(255,255,255,0) 15% 25%,
          rgba(43,109,232,.22) 25% 30%,
          rgba(255,255,255,0) 30% 40%,
          rgba(43,109,232,.18) 40% 45%,
          rgba(255,255,255,0) 45% 100%);
      filter: blur(1px);
      opacity:.9;
      animation: burstSpin 700ms linear infinite;
      z-index:1;
    }
    @keyframes burstSpin{ to{ transform: rotate(360deg); } }
    @keyframes winPop{
      0%   { transform: scale(.85); opacity: 0; }
      18%  { transform: scale(1.06); opacity: 1; }
      36%  { transform: scale(.98); }
      55%  { transform: scale(1.00); }
      100% { transform: scale(1.00); opacity: 0; }
    }
    @keyframes winGlow{
      from{ filter: drop-shadow(0 0 0 rgba(43,109,232,0)); }
      to  { filter: drop-shadow(0 0 14px rgba(43,109,232,.55)); }
    }

    /* ===== 5の倍数：虹色超当たり ===== */
    .winInner.big{
      animation: winPopBig 2200ms ease-out forwards;
      border:2px solid rgba(255,255,255,.45);
      box-shadow:
        0 24px 80px rgba(0,0,0,.30),
        0 0 40px rgba(255,255,255,.25);
    }

    /* 虹のグロー（外側ににじむ） */
    .winInner.big::before{
      content:"";
      position:absolute;
      inset:-18px;
      border-radius:28px;
      background: conic-gradient(
        from 0deg,
        #ff2d2d,
        #ff8a00,
        #ffe600,
        #3cff00,
        #00ffd5,
        #0088ff,
        #7a00ff,
        #ff00c8,
        #ff2d2d
      );
      filter: blur(14px);
      opacity:.85;
      animation: rainbowSpin 480ms linear infinite;
      z-index:0;
      mix-blend-mode: screen;
    }

    /* 虹のキラキラ（内側） */
    .winInner.big::after{
      content:"";
      position:absolute;
      inset:0;
      border-radius:22px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.65) 0%, rgba(255,255,255,0) 45%),
        radial-gradient(circle at 80% 40%, rgba(255,255,255,.45) 0%, rgba(255,255,255,0) 50%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%);
      opacity:.45;
      animation: sparkle 700ms ease-in-out infinite alternate;
      z-index:1;
      pointer-events:none;
    }

    /* 虹色テキスト＋ギラギラ */
    .winInner.big .winText{
      background: linear-gradient(90deg,
        #ff2d2d, #ff8a00, #ffe600, #3cff00,
        #00ffd5, #0088ff, #7a00ff, #ff00c8, #ff2d2d);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
      animation: rainbowText 450ms linear infinite;
      filter: drop-shadow(0 0 10px rgba(255,255,255,.55))
              drop-shadow(0 0 18px rgba(0,255,255,.35))
              drop-shadow(0 0 22px rgba(255,0,200,.25));
    }

    /* バーストも虹に（回転速く） */
    .winInner.big .winBurst{
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 55%),
        conic-gradient(
          from 0deg,
          rgba(255,45,45,.35),
          rgba(255,138,0,.30),
          rgba(255,230,0,.30),
          rgba(60,255,0,.30),
          rgba(0,255,213,.30),
          rgba(0,136,255,.30),
          rgba(122,0,255,.30),
          rgba(255,0,200,.30),
          rgba(255,45,45,.35)
        );
      opacity: 1;
      animation: burstSpin 260ms linear infinite;
      filter: blur(0.6px);
    }

    @keyframes winPopBig{
      0%   { transform: scale(.72); opacity: 0; }
      10%  { transform: scale(1.16); opacity: 1; }
      22%  { transform: scale(1.02); }
      40%  { transform: scale(1.10); }
      60%  { transform: scale(1.00); }
      78%  { transform: scale(1.06); }
      100% { transform: scale(1.00); opacity: 0; }
    }

    @keyframes rainbowSpin{
      to { transform: rotate(360deg); }
    }

    @keyframes rainbowText{
      0%   { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    @keyframes sparkle{
      from { opacity: .25; transform: scale(1.00); }
      to   { opacity: .60; transform: scale(1.02); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar">
        <h1>たすきがけの因数分解</h1>
        <div class="badge">正解数：<span id="score">0</span></div>
      </div>

      <div class="boardWrap" id="boardWrap">
        <svg class="lines" id="svgLines" aria-hidden="true">
          <line id="lineAD" x1="0" y1="0" x2="0" y2="0"></line>
          <line id="lineCB" x1="0" y1="0" x2="0" y2="0"></line>
          <path id="arrowBtoBC" d=""></path>
          <path id="arrowDtoAD" d=""></path>
        </svg>

        <div class="board" id="board">
          <div id="termA" class="termBox" style="grid-row:1; grid-column:1;">x²</div>

          <div class="termMidWrap" style="grid-row:1; grid-column:2;">
            <div id="termB" class="termMid">+3x</div>
            <div id="ringB" class="ring"></div>
          </div>

          <div id="termC" class="termBox" style="grid-row:1; grid-column:3;">-2</div>
          <div class="blank" style="grid-row:1; grid-column:4;"></div>
          <div class="blank" style="grid-row:1; grid-column:5;"></div>

          <input id="A" class="in" placeholder="A" autocomplete="off" style="grid-row:2; grid-column:1;" />
          <div class="blank" style="grid-row:2; grid-column:2;"></div>
          <input id="B" class="in" placeholder="B" autocomplete="off" style="grid-row:2; grid-column:3;" />
          <div class="blank" style="grid-row:2; grid-column:4;"></div>

          <div class="cellWrap" style="grid-row:2; grid-column:5;">
            <input id="BC" class="in" placeholder="BC" autocomplete="off" />
            <div id="judgeBC" class="miniJudge">未判定</div>
          </div>

          <div class="blank" style="grid-row:3; grid-column:1;"></div>
          <div class="blank" style="grid-row:3; grid-column:2;"></div>
          <div class="blank" style="grid-row:3; grid-column:3;"></div>
          <div class="blank" style="grid-row:3; grid-column:4;"></div>
          <div class="plus" style="grid-row:3; grid-column:5;">＋</div>

          <input id="C" class="in" placeholder="C" autocomplete="off" style="grid-row:4; grid-column:1;" />
          <div class="blank" style="grid-row:4; grid-column:2;"></div>
          <input id="D" class="in" placeholder="D" autocomplete="off" style="grid-row:4; grid-column:3;" />
          <div class="blank" style="grid-row:4; grid-column:4;"></div>

          <div class="cellWrap" style="grid-row:4; grid-column:5;">
            <input id="AD" class="in" placeholder="AD" autocomplete="off" />
            <div id="judgeAD" class="miniJudge">未判定</div>
          </div>

          <div style="grid-row:5; grid-column:1;">
            <div id="boxAC" class="box muted">AC（まだ）</div>
            <span id="judgeAC" class="judgePill">未判定</span>
          </div>

          <div class="blank" style="grid-row:5; grid-column:2;"></div>

          <div style="grid-row:5; grid-column:3;">
            <div id="boxBD" class="box muted">BD（まだ）</div>
            <span id="judgeBD" class="judgePill">未判定</span>
          </div>

          <div class="blank" style="grid-row:5; grid-column:4;"></div>

          <div class="sumCell" style="grid-row:5; grid-column:5;">
            <input id="SUM" class="in" placeholder="AD+BC" autocomplete="off" />
            <div id="ringSUM" class="ring"></div>
            <div id="sumJudge" class="sumJudge">未判定</div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="checkBtn">確認（積の和）</button>
        <button id="nextBtn" type="button" disabled>次の問題</button>
        <button id="resetBtn" type="button">入力リセット</button>
      </div>
    </div>
  </div>

  <div id="winOverlay" class="winOverlay" aria-hidden="true">
    <div class="winInner" id="winInner">
      <div class="winBurst"></div>
      <div class="winText"><span id="winCount">0</span>問正解！</div>
      <div class="winSub">やったね！</div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function parseNum(s){
      if (s == null) return null;
      const t = String(s).trim();
      if (t === "") return null;
      const n = Number(t);
      return Number.isFinite(n) ? n : NaN;
    }
    function fmt(n){
      if (n == null) return "";
      if (!Number.isFinite(n)) return "？";
      return Number.isInteger(n) ? String(n) : String(n);
    }
    function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
    function randNonZeroInt(minAbs, maxAbs){
      let v = 0;
      while (v === 0){
        const sign = Math.random() < 0.5 ? -1 : 1;
        v = sign * randInt(minAbs, maxAbs);
      }
      return v;
    }

    function setJudge(el, state, text){
      el.classList.remove("ok","bad");
      if (state === "ok") el.classList.add("ok");
      if (state === "bad") el.classList.add("bad");
      el.textContent = text;
    }
    function setMiniJudge(el, state, text){
      el.classList.remove("ok","bad");
      if (state === "ok") el.classList.add("ok");
      if (state === "bad") el.classList.add("bad");
      el.textContent = text;
    }
    function setBox(el, text, muted){
      el.textContent = text;
      el.classList.toggle("muted", !!muted);
    }
    function setSumJudge(state, text){
      const el = $("sumJudge");
      el.classList.remove("ok","bad");
      if (state === "ok") el.classList.add("ok");
      if (state === "bad") el.classList.add("bad");
      el.textContent = text;
    }

    function hideRings(){
      $("ringB").style.display = "none";
      $("ringSUM").style.display = "none";
      $("ringB").classList.remove("ok","bad");
      $("ringSUM").classList.remove("ok","bad");
    }
    function showRings(ok){
      $("ringB").style.display = "block";
      $("ringSUM").style.display = "block";
      $("ringB").classList.toggle("ok", !!ok);
      $("ringSUM").classList.toggle("ok", !!ok);
      $("ringB").classList.toggle("bad", !ok);
      $("ringSUM").classList.toggle("bad", !ok);
    }

    // bx：±1のときは +x / −x
    function termBText(b){
      const sign = b >= 0 ? "+" : "−";
      const abs = Math.abs(b);
      const coef = (abs === 1) ? "" : String(abs);
      return `${sign}${coef}x`;
    }
    function termCText(c){
      const sign = c >= 0 ? "+" : "−";
      return `${sign}${Math.abs(c)}`;
    }

    // ===== 正解演出（5の倍数だけ虹） =====
    let winTimer = null;
    function showWinOverlay(count){
      const o = $("winOverlay");
      const c = $("winCount");
      const inner = $("winInner");
      if (!o || !c || !inner) return;

      c.textContent = String(count);

      const big = (count % 5 === 0);
      const dur = big ? 2200 : 1100;

      inner.classList.toggle("big", big);

      o.classList.remove("show");
      void o.offsetWidth;
      o.classList.add("show");

      if (winTimer) clearTimeout(winTimer);
      winTimer = setTimeout(() => {
        o.classList.remove("show");
        inner.classList.remove("big");
      }, dur);
    }

    let current = {a:1,b:0,c:0,q:1,s:1};
    let score = 0;
    let solved = false;

    // a=1固定： (x+q)(x+s)
    function newProblem(){
      const q = randNonZeroInt(1, 9);
      const s = randNonZeroInt(1, 9);

      current = {
        a: 1,
        b: q + s,
        c: q * s,
        q, s
      };

      $("termA").textContent = "x²";
      $("termB").textContent = termBText(current.b);
      $("termC").textContent = termCText(current.c);

      ["A","B","C","D","BC","AD","SUM"].forEach(id => $(id).value = "");

      setBox($("boxAC"), "AC（まだ）", true);
      setBox($("boxBD"), "BD（まだ）", true);
      setJudge($("judgeAC"), null, "未判定");
      setJudge($("judgeBD"), null, "未判定");

      setMiniJudge($("judgeBC"), null, "未判定");
      setMiniJudge($("judgeAD"), null, "未判定");
      setSumJudge(null, "未判定");
      hideRings();

      $("nextBtn").disabled = true;
      solved = false;

      requestAnimationFrame(updateLines);
    }

    function centerOf(el){
      const r = el.getBoundingClientRect();
      return { x: r.left + r.width/2, y: r.top + r.height/2 };
    }
    function localPoint(wrapRect, p){
      return { x: p.x - wrapRect.left, y: p.y - wrapRect.top };
    }

    function arrowPath(from, to){
      const dx = to.x - from.x, dy = to.y - from.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len, uy = dy / len;

      const headLen = 14;
      const endX = to.x - ux * 8;
      const endY = to.y - uy * 8;

      const perpX = -uy, perpY = ux;
      const leftX  = endX - ux * headLen + perpX * 8;
      const leftY  = endY - uy * headLen + perpY * 8;
      const rightX = endX - ux * headLen - perpX * 8;
      const rightY = endY - uy * headLen - perpY * 8;

      return `M ${from.x} ${from.y} L ${endX} ${endY} M ${leftX} ${leftY} L ${endX} ${endY} L ${rightX} ${rightY}`;
    }

    function updateLines(){
      const wrap = $("boardWrap");
      const svg  = $("svgLines");
      if (!wrap || !svg) return;

      const wr = wrap.getBoundingClientRect();
      svg.setAttribute("width", wr.width);
      svg.setAttribute("height", wr.height);
      svg.setAttribute("viewBox", `0 0 ${wr.width} ${wr.height}`);

      const A = $("A"), B = $("B"), C = $("C"), D = $("D");
      const cellBC = $("BC");
      const cellAD = $("AD");

      const pA = localPoint(wr, centerOf(A));
      const pB = localPoint(wr, centerOf(B));
      const pC = localPoint(wr, centerOf(C));
      const pD = localPoint(wr, centerOf(D));

      const pBC = localPoint(wr, centerOf(cellBC));
      const pAD = localPoint(wr, centerOf(cellAD));

      $("lineAD").setAttribute("x1", pA.x);
      $("lineAD").setAttribute("y1", pA.y);
      $("lineAD").setAttribute("x2", pD.x);
      $("lineAD").setAttribute("y2", pD.y);

      $("lineCB").setAttribute("x1", pC.x);
      $("lineCB").setAttribute("y1", pC.y);
      $("lineCB").setAttribute("x2", pB.x);
      $("lineCB").setAttribute("y2", pB.y);

      $("arrowBtoBC").setAttribute("d", arrowPath(pB, pBC));
      $("arrowDtoAD").setAttribute("d", arrowPath(pD, pAD));
    }

    window.addEventListener("resize", () => requestAnimationFrame(updateLines));
    window.addEventListener("scroll", () => requestAnimationFrame(updateLines), {passive:true});

    function resetRightSide(){
      setMiniJudge($("judgeBC"), null, "未判定");
      setMiniJudge($("judgeAD"), null, "未判定");
      setSumJudge(null, "未判定");
      hideRings();
      if (!solved) $("nextBtn").disabled = true;
    }

    function computeRealtime(){
      const A = parseNum($("A").value);
      const B = parseNum($("B").value);
      const C = parseNum($("C").value);
      const D = parseNum($("D").value);

      if ([A,B,C,D].some(v => v !== null && Number.isNaN(v))){
        setJudge($("judgeAC"), "bad", "数を入力");
        setJudge($("judgeBD"), "bad", "数を入力");
        setBox($("boxAC"), "AC（まだ）", true);
        setBox($("boxBD"), "BD（まだ）", true);
        resetRightSide();
        return;
      }

      let acOk = null;
      if (A != null && C != null){
        const acVal = A * C;
        setBox($("boxAC"), `AC = ${fmt(acVal)}`, false);
        acOk = (acVal === 1);
        setJudge($("judgeAC"), acOk ? "ok" : "bad", acOk ? "合っています" : "違います");
      } else {
        setBox($("boxAC"), "AC（まだ）", true);
        setJudge($("judgeAC"), null, "未判定");
      }

      let bdOk = null;
      if (B != null && D != null){
        const bdVal = B * D;
        setBox($("boxBD"), `BD = ${fmt(bdVal)}`, false);
        bdOk = (bdVal === current.c);
        setJudge($("judgeBD"), bdOk ? "ok" : "bad", bdOk ? "合っています" : "違います");
      } else {
        setBox($("boxBD"), "BD（まだ）", true);
        setJudge($("judgeBD"), null, "未判定");
      }

      const baseReady = (acOk === true && bdOk === true);
      if (!baseReady){
        resetRightSide();
        return;
      }

      const bcIn = parseNum($("BC").value);
      const adIn = parseNum($("AD").value);

      if ([bcIn, adIn].some(v => v !== null && Number.isNaN(v))){
        if (Number.isNaN(bcIn)) setMiniJudge($("judgeBC"), "bad", "数を入力");
        if (Number.isNaN(adIn)) setMiniJudge($("judgeAD"), "bad", "数を入力");
        setSumJudge(null, "未判定");
        hideRings();
        if (!solved) $("nextBtn").disabled = true;
        return;
      }

      const expectBC = B * C;
      const expectAD = A * D;

      if (bcIn != null){
        const bcOk = (bcIn === expectBC);
        setMiniJudge($("judgeBC"), bcOk ? "ok" : "bad", bcOk ? "合っています" : "違います");
      } else {
        setMiniJudge($("judgeBC"), null, "未判定");
      }

      if (adIn != null){
        const adOk = (adIn === expectAD);
        setMiniJudge($("judgeAD"), adOk ? "ok" : "bad", adOk ? "合っています" : "違います");
      } else {
        setMiniJudge($("judgeAD"), null, "未判定");
      }

      if (!solved) $("nextBtn").disabled = true;
    }

    function checkSum(){
      if (solved){
        setSumJudge("ok", "この問題は正解済み（次の問題へ）");
        $("nextBtn").disabled = false;
        return;
      }

      const A = parseNum($("A").value);
      const B = parseNum($("B").value);
      const C = parseNum($("C").value);
      const D = parseNum($("D").value);
      const bcIn = parseNum($("BC").value);
      const adIn = parseNum($("AD").value);
      const sumIn = parseNum($("SUM").value);

      const anyNaN = [A,B,C,D,bcIn,adIn,sumIn].some(v => v !== null && Number.isNaN(v));
      if (anyNaN){
        setSumJudge("bad", "数を入力");
        hideRings();
        return;
      }

      const anyNull = [A,B,C,D,bcIn,adIn,sumIn].some(v => v == null);
      if (anyNull){
        setSumJudge("bad", "まず全部入力");
        hideRings();
        return;
      }

      if (A*C !== 1 || B*D !== current.c){
        setSumJudge("bad", "先に AC=1 と BD=c をそろえる");
        hideRings();
        return;
      }

      const expectBC = B * C;
      const expectAD = A * D;

      if (bcIn !== expectBC || adIn !== expectAD){
        setSumJudge("bad", "BCとADも確認");
        hideRings();
        return;
      }

      const expectSum = expectAD + expectBC;
      const ok = (sumIn === expectSum) && (sumIn === current.b);

      showRings(ok);

      if (ok){
        setSumJudge("ok", `一致（b = ${fmt(current.b)}）`);
        score++;
        $("score").textContent = String(score);
        showWinOverlay(score);
        $("nextBtn").disabled = false;
        solved = true;
      } else {
        if (sumIn !== expectSum){
          setSumJudge("bad", "和が違います（AD+BCを確認）");
        } else {
          setSumJudge("bad", `bと一致しません（b = ${fmt(current.b)}）`);
        }
        $("nextBtn").disabled = true;
      }

      requestAnimationFrame(updateLines);
    }

    ["A","B","C","D","BC","AD","SUM"].forEach(id => {
      $(id).addEventListener("input", () => computeRealtime());
      $(id).addEventListener("focus", () => requestAnimationFrame(updateLines));
    });

    $("checkBtn").addEventListener("click", () => checkSum());
    $("resetBtn").addEventListener("click", () => {
      ["A","B","C","D","BC","AD","SUM"].forEach(id => $(id).value = "");
      computeRealtime();
      requestAnimationFrame(updateLines);
    });
    $("nextBtn").addEventListener("click", () => newProblem());

    newProblem();
  </script>
</body>
</html>
